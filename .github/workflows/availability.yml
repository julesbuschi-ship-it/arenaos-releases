name: Disponibilités Beds24 → web/data/availability.json

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: availability
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Récupérer les 60 prochains jours
        env:
          BEDS24_TOKEN: ${{ secrets.BEDS24_TOKEN }}
          BEDS24_REFRESH_TOKEN: ${{ secrets.BEDS24_REFRESH_TOKEN }}
        run: node web/data/fetch-availability.mjs
      - name: Publier si changement
        run: |
          git config user.name "arenaos-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet -- web/data/availability.json; then echo "rien à publier"; exit 0; fi
          git add web/data/availability.json
          git commit -m "availability.json : $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
